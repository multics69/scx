[package]
name = "scx_min"
version = "1.1.3"
authors = ["Changwoo Min <changwoo@igalia.com>"]
edition = "2024"
rust-version = "1.91"
description = "A minimal sched_ext scheduler. https://github.com/sched-ext/scx/tree/main"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
ctrlc = { version = "3", features = ["termination"] }
libbpf-rs = "=0.27.2"
log = "0.4"
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.3" }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.3" }

[features]
enable_backtrace = []
